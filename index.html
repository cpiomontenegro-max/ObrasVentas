<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rinde · Club Obras Sanitarias</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --surface2: #f9f9f9;
    --surface3: #f0f0f0;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --accent2: #1a1a1a;
    --green: #16a34a;
    --red: #dc2626;
    --text: #111111;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border2: #eeeeee;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Header */
  header {
    padding: 0 24px;
    border-bottom: 1px solid #222222;
    display: flex;
    align-items: center;
    gap: 14px;
    background: #111111;
    position: sticky; top:0; z-index:10;
    height: 58px;
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
  }
  .logo-dot { display: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .header-titles { display: flex; flex-direction: column; gap: 1px; }
  header h1 { font-size: 0.95rem; font-weight: 900; letter-spacing: 0.08em; color: #ffffff; text-transform: uppercase; }
  header h1 span { color: var(--accent); }
  .header-sub { font-size: 0.6rem; color: #888888; letter-spacing: 0.1em; text-transform: uppercase; }
  .club-badge {
    margin-left: auto;
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 800;
    color: #111111;
    background: var(--accent);
    padding: 5px 14px;
    border-radius: 4px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  /* Main layout */
  .layout {
    display: grid;
    grid-template-columns: 310px 1fr;
    flex: 1;
    height: calc(100vh - 94px);
    overflow: hidden;
  }
  /* Sidebar */
  .sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #ffffff;
  }
  .sidebar-title {
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 700;
    padding: 0 2px 8px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 2px;
  }
  /* Totals row */
  .totals-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 6px;
  }
  .total-card {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 8px;
    padding: 10px 12px;
    border-top: 3px solid #16a34a;
  }
  .total-card.gastos {
    background: #eff6ff;
    border-color: #bfdbfe;
    border-top-color: var(--accent);
  }
  .total-label { font-size: 0.55rem; letter-spacing: 0.12em; color: var(--muted); text-transform:uppercase; font-weight:700; margin-bottom: 4px; }
  .total-value { font-family: 'Space Mono', monospace; font-size: 0.85rem; font-weight:700; }
  .total-value.ventas { color: var(--green); }
  .total-value.gastos { color: var(--accent); }
  /* Cat cards */
  .cat-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .cat-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(37,99,235,0.12);
  }
  .cat-card.active {
    border-color: var(--accent);
    border-left: 3px solid var(--accent);
    background: #eff6ff;
  }
  .cat-card.disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .cat-name { font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; color: var(--text); }
  .cat-icon { font-size: 0.8rem; }
  .cat-bar-wrap { height: 3px; background: #f3f4f6; border-radius: 2px; margin: 5px 0; }
  .cat-bar { height: 3px; border-radius: 2px; background: var(--accent); transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }
  .cat-stats { display:flex; justify-content:space-between; align-items: center; }
  .cat-monto { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--text); font-weight: 700; }
  .cat-pct { font-family: 'Space Mono', monospace; font-size: 0.6rem; color: var(--muted); background: #f3f4f6; padding: 1px 5px; border-radius: 3px; }
  /* Chat area */
  .chat-area { display: flex; flex-direction: column; overflow: hidden; background: #f9f9f9; }
  .messages {
    flex: 1; overflow-y: auto;
    padding: 20px 28px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .message { display: flex; gap: 10px; max-width: 820px; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items:center; justify-content:center;
    font-size: 0.85rem; flex-shrink:0; font-weight:800;
  }
  .avatar.ai { background: #111111; color: white; }
  .avatar.user { background: var(--accent); color: white; }
  .bubble {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.87rem;
    line-height: 1.65;
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .message.user .bubble { background: var(--accent); color: white; border-color: var(--accent); }
  .bubble table { width:100%; border-collapse:collapse; margin-top: 10px; }
  .bubble th { font-size: 0.65rem; letter-spacing:0.08em; color:var(--muted); text-transform:uppercase; text-align:left; padding: 5px 8px; border-bottom: 2px solid var(--border); font-weight:700; }
  .bubble td { font-family:'Space Mono',monospace; font-size:0.75rem; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  .bubble td.monto { color: var(--green); font-weight:700; }
  .bubble td.rank { color: var(--accent); font-weight:700; }
  .bubble .highlight { color: var(--accent); font-weight:700; }
  .bubble .tip { margin-top:8px; font-size:0.78rem; color:var(--muted); border-top: 1px solid var(--border); padding-top:8px; }
  /* Input */
  .input-area {
    padding: 12px 28px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; background: #ffffff;
  }
  .suggestions { padding: 0 28px 10px; display: flex; flex-wrap: wrap; gap: 6px; background: #ffffff; border-bottom: 1px solid var(--border); }
  .suggestion-btn {
    font-family: 'Inter', sans-serif; font-size: 0.72rem; font-weight:600;
    background: #f5f5f5; border: 1px solid var(--border);
    color: var(--muted); padding: 5px 12px; border-radius: 20px; cursor: pointer; transition: all 0.15s;
  }
  .suggestion-btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
  input[type=text] {
    flex: 1; background: #f5f5f5; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 16px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 0.88rem; outline: none; transition: all 0.15s;
  }
  input[type=text]:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  input[type=text]::placeholder { color: #aaa; }
  .send-btn {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 10px 20px; font-family: 'Inter', sans-serif;
    font-weight: 800; font-size: 0.82rem; cursor: pointer; transition: all 0.15s;
    white-space: nowrap; letter-spacing: 0.03em; text-transform: uppercase;
  }
  .send-btn:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .typing { display: flex; gap: 5px; align-items:center; padding: 8px 4px; }
  .typing span { width:7px; height:7px; border-radius:50%; background: var(--accent); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2){animation-delay:0.2s} .typing span:nth-child(3){animation-delay:0.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #f5f5f5; }
  ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #ccc; }

  /* Modales */
  .cocina-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 100;
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .cocina-overlay.open { display: flex; }
  .cocina-modal {
    background: #ffffff;
    border-radius: 12px; padding: 24px; width: 92%; max-width: 480px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: modalIn 0.2s cubic-bezier(0.34,1.4,0.64,1);
    border-top: 4px solid var(--accent);
  }
  @keyframes modalIn { from{opacity:0;transform:scale(0.95) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .cocina-modal h2 {
    font-size: 1rem; font-weight: 900; color: var(--text);
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    padding-bottom: 12px; border-bottom: 2px solid var(--border);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .cocina-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.84rem;
  }
  .cocina-label { color: var(--muted); font-weight: 500; }
  .cocina-val { font-family: 'Space Mono', monospace; font-size: 0.8rem; font-weight: 700; }
  .cocina-val.green { color: var(--green); }
  .cocina-val.orange { color: var(--accent); }
  .cocina-val.red { color: var(--red); }
  .alerta-box { margin: 12px 0; padding: 10px 14px; border-radius: 8px; font-size: 0.8rem; line-height: 1.55; font-weight: 500; }
  .alerta-ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: var(--green); }
  .alerta-warn { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
  .pagos-list { max-height: 130px; overflow-y: auto; margin: 6px 0; }
  .pagos-list-row {
    display: flex; justify-content: space-between; padding: 5px 0;
    border-bottom: 1px solid var(--border); font-size: 0.72rem; color: var(--muted);
    gap: 8px;
  }
  .pagos-list-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pagos-list-row span:last-child { font-family: 'Space Mono', monospace; color: var(--text); flex-shrink: 0; font-weight: 700; }
  .mensaje-box {
    margin-top: 12px; background: #f9f9f9; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    font-family: 'Space Mono', monospace; font-size: 0.71rem; line-height: 1.75;
    color: var(--text); white-space: pre-wrap;
  }
  .copy-btn {
    margin-top: 10px; width: 100%; padding: 11px;
    background: var(--accent); color: white; border: none; border-radius: 8px;
    font-family: 'Inter', sans-serif; font-weight: 800; font-size: 0.82rem; cursor: pointer;
    transition: all 0.15s; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .copy-btn:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
  .close-modal-btn {
    margin-top: 8px; width: 100%; padding: 9px; background: transparent;
    color: var(--muted); border: 1px solid var(--border); border-radius: 8px;
    font-family: 'Inter', sans-serif; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; font-weight: 600;
  }
  .close-modal-btn:hover { color: var(--text); border-color: #999; background: #f5f5f5; }
  .modal-section-title {
    font-size: 0.58rem; letter-spacing: .15em; text-transform: uppercase;
    color: var(--muted); font-weight: 800; margin: 14px 0 6px;
    padding-bottom: 4px; border-bottom: 2px solid var(--border);
  }
  .balance-total {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border-radius: 8px; margin-top: 12px;
    background: #111111; border: none;
  }
  .balance-total .label { font-size: 0.8rem; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 0.05em; }
  .balance-total .val { font-family: 'Space Mono', monospace; font-size: 1rem; font-weight: 700; }
  .balance-total .val.green { color: #4ade80; }
  .balance-total .val.red { color: #f87171; }

  /* Barra de períodos */
  .periodo-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 24px;
    background: #0d0d0d;
    border-bottom: 3px solid var(--accent);
    height: 36px;
    overflow-x: auto;
    position: sticky;
    top: 58px;
    z-index: 9;
  }
  .periodo-nav-label {
    font-size: 0.52rem;
    letter-spacing: 0.15em;
    color: #444;
    text-transform: uppercase;
    font-weight: 700;
    white-space: nowrap;
    margin-right: 4px;
  }
  .periodo-btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.62rem;
    font-weight: 700;
    color: #555;
    background: transparent;
    border: 1px solid #2a2a2a;
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    letter-spacing: 0.03em;
  }
  .periodo-btn:hover { color: #ccc; border-color: #444; }
  .periodo-btn.active {
    color: #ffffff;
    background: var(--accent);
    border-color: var(--accent);
  }

</style>
</head>

let periodoActivo = PERIODOS[PERIODOS.length - 1]; // Último período por defecto
let DATA = periodoActivo.ventas;
let GASTOS = periodoActivo.gastos;

function setPeriodo(id) {
  periodoActivo = PERIODOS.find(p => p.id === id);
  DATA = periodoActivo.ventas;
  GASTOS = periodoActivo.gastos;
  // Recalcular
  recalcular();
  // Actualizar botones
  document.querySelectorAll('.periodo-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });
  // Limpiar sidebar y reconstruir
  document.getElementById('catCards').innerHTML = '';
  buildSidebar();
  // Limpiar chat
  document.getElementById('messages').innerHTML = '';
  mostrarBienvenida();
}

// ── HELPERS ─────────────────────────────────────────────────────────
function fmt(n) {
  return '$' + Math.round(n).toLocaleString('es-AR');
}
function groupBy(data, key) {
  return data.reduce((acc, item) => {
    const k = item[key] || 'Sin categoría';
    if (!acc[k]) acc[k] = { total: 0, cantidad: 0, items: [] };
    acc[k].total += item.Total || 0;
    acc[k].cantidad += item.Cantidad || 0;
    acc[k].items.push(item);
    return acc;
  }, {});
}

// ── CALCULOS ─────────────────────────────────────────────────────────
// Variables reactivas — se recalculan al cambiar período
let byCat, totalGeneral, catSorted, maxCatTotal, gastosPorCat, totalGastos;

function recalcular() {
  byCat = groupBy(DATA, 'Categoria');
  totalGeneral = Object.values(byCat).reduce((s, c) => s + c.total, 0);
  catSorted = Object.entries(byCat).sort((a,b) => b[1].total - a[1].total);
  maxCatTotal = catSorted[0][1].total;
  gastosPorCat = GASTOS.reduce((acc, g) => {
    const cat = g['Categoría'] || 'Sin categoría';
    if (!acc[cat]) acc[cat] = { total: 0, items: [] };
    acc[cat].total += g.Importe || 0;
    acc[cat].items.push(g);
    return acc;
  }, {});
  totalGastos = GASTOS.reduce((s, g) => s + (g.Importe || 0), 0);
  // Actualizar título
  document.getElementById('headerPeriodo').textContent = periodoActivo.label.toUpperCase();
  document.title = 'Rinde ' + periodoActivo.label + ' · Club';
}

const history = [];
let isLoading = false;

function addMessage(role, html) {
  const msgs = document.getElementById('messages');

  div.className = `message ${role}`;

function addTyping() {

  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="avatar ai">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;

}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  doSend(text);
}

function sendSuggestion(btn, override) {
  const text = override || btn.textContent;
  doSend(text);
}

async function doSend(text) {
  if (isLoading) return;
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('suggestions').style.display = 'none';

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  addTyping();

  // Contexto de datos para el sistema
  const dataContext = JSON.stringify(catSorted.map(([cat, d]) => ({
    categoria: cat,
    total: d.total,
    cantidad: d.cantidad,
    productos: d.items.map(i => ({ nombre: i.Nombre, cantidad: i.Cantidad, total: i.Total }))
  })));

  const gastosPorCat = GASTOS.reduce((acc, g) => {
    const cat = g['Categoría'] || 'Sin categoría';
    if (!acc[cat]) acc[cat] = { total: 0, items: [] };
    acc[cat].total += g.Importe || 0;
    acc[cat].items.push(g);
    return acc;
  }, {});
  const totalGastos = GASTOS.reduce((s, g) => s + (g.Importe || 0), 0);
  const gastosResumen = Object.entries(gastosPorCat).sort((a,b)=>b[1].total-a[1].total).map(([cat, d]) => ({
    categoria: cat, total: d.total, registros: d.items.length
  }));

  const systemPrompt = `Sos un agente analista financiero para un club deportivo argentino.
Tenés acceso a VENTAS y GASTOS de ${periodoActivo.label}. Respondé siempre en español, claro y útil.
Usá HTML con th/td para tablas. Usá <span class="highlight"> para cifras clave. Usá <div class="tip"> para recomendaciones.
Los montos son en pesos argentinos.

=== VENTAS: ${JSON.stringify(catSorted.map(([cat, d]) => ({cat, total: d.total, qty: d.cantidad})))} | TOTAL: $${Math.round(totalGeneral).toLocaleString('es-AR')} ===
=== GASTOS: ${JSON.stringify(gastosResumen)} | TOTAL: $${Math.round(totalGastos).toLocaleString('es-AR')} ===
=== RESULTADO NETO: $${Math.round(totalGeneral - totalGastos).toLocaleString('es-AR')} ===
Gastos: Compra=mercadería, Sueldos=personal, Inversión=activos, Cocina=insumos diarios, Operativo=servicios/mantenimiento.`;

  const apiKey = '';

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: systemPrompt,
        messages: history
      })
    });
    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    const reply = data.content?.map(c => c.text || '').join('') || 'No pude procesar la respuesta.';
    history.push({ role: 'assistant', content: reply });
    removeTyping();
    addMessage('ai', reply);
  } catch(e) {
    removeTyping();
    addMessage('ai', `Error: ${e.message || 'No se pudo conectar con el agente. Verificá tu API Key.'}`);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
}

function abrirCantina() {
  const cats = ['Bebidas','Snacks','Almacen','Comida'];

  cats.forEach(c => {
    const items = DATA.filter(d => d.Categoria === c);
    const total = items.reduce((s,d) => s + (d.Total||0), 0);
    ventasPorCat[c] = total;
    totalVentas += total;
  });
  // Agua Caliente pertenece a Cafetería pero se contabiliza en Cantina
  const aguaCaliente = DATA.filter(d => d.Nombre === 'Agua Caliente').reduce((s,d) => s + (d.Total||0), 0);
  ventasPorCat['Cafetería (Agua Caliente)'] = aguaCaliente;
  totalVentas += aguaCaliente;

  // Gastos Compra excluyendo proveedores de otros paneles
  const pagosCompra = GASTOS.filter(g => {
    if (g['Categoría'] !== 'Compra') return false;
    const p = (g.Proveedor||'').toLowerCase();
    return !EXCLUIR_CANTINA.some(ex => p.includes(ex));
  });
  const totalCompras = pagosCompra.reduce((s,g) => s + (g.Importe||0), 0);
  const balance = totalVentas - totalCompras;
  const positivo = balance >= 0;

  const filasVentas = cats.map(c =>
    `<div class="cocina-row">
      <span class="cocina-label">${c}</span>
      <span class="cocina-val green">${fmt(ventasPorCat[c])}</span>
    </div>`
  ).join('');

  const provMap = {};
  pagosCompra.forEach(g => { const p = g.Proveedor||'Varios'; provMap[p] = (provMap[p]||0) + g.Importe; });
  const topProv = Object.entries(provMap).sort((a,b)=>b[1]-a[1]);
  const filasProv = topProv.map(([p,v]) =>
    `<div class="pagos-list-row"><span>${p}</span><span>${fmt(v)}</span></div>`
  ).join('');

  document.getElementById('comprasContenido').innerHTML = `
    <div class="modal-section-title">Ventas Cantina</div>
    ${filasVentas}
    <div class="cocina-row" style="font-weight:700">
      <span class="cocina-label" style="color:var(--text)">Total ventas</span>
      <span class="cocina-val green">${fmt(totalVentas)}</span>

  // Detalle costos por proveedor (agrupado)
  const provMap = {};
  costos.forEach(g => { const p = g.Proveedor||'Varios'; provMap[p] = (provMap[p]||0) + g.Importe; });
  const lineasCostos = Object.entries(provMap).sort((a,b)=>b[1]-a[1])
    .map(([p,v]) => `${p} — ${fmt(v)}`).join('\n');

  const mensajeTexto =
`Te paso el resumen de cafetería de ${mes}:

Ventas cafetería
${lineasVentas}
Total ventas — ${fmt(totalVentas)}

Costos
${lineasCostos}
Total costos — ${fmt(totalCostos)}

Balance neto — ${fmt(balance)}
Comisión (50%) — ${fmt(comision)}`;

  document.getElementById('cafeteriaContenido').innerHTML = `
    <div class="modal-section-title">Ventas cafetería</div>
    <div class="pagos-list">${filasVentas}</div>
    <div class="cocina-row" style="font-weight:700">
      <span class="cocina-label" style="color:var(--text)">Total ventas</span>
      <span class="cocina-val green">${fmt(totalVentas)}</span>
    </div>

    <div class="modal-section-title">Costos (Capsulandia + Panificadora Kuresza)</div>
    <div class="pagos-list">${filasCostos || '<div class="pagos-list-row"><span>Sin registros</span><span>—</span></div>'}</div>
    <div class="cocina-row" style="font-weight:700">
      <span class="cocina-label" style="color:var(--text)">Total costos</span>
      <span class="cocina-val orange">${fmt(totalCostos)}</span>
    </div>

    <div class="balance-total">
      <span class="label">Balance cafetería</span>
      <span class="val ${positivo?'green':'red'}">${fmt(balance)}</span>
    </div>

    <div class="cocina-row" style="margin-top:8px">
      <span class="cocina-label" style="font-weight:700;color:var(--text)">💰 Comisión Florencia Paz (50% balance)</span>
      <span class="cocina-val green" style="font-size:1rem;font-weight:700">${fmt(comision)}</span>
    </div>

    <div style="font-size:0.72rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--border);padding-top:12px;margin:12px 0 6px">Mensaje para enviar</div>
    <div class="mensaje-box" id="mensajeCafeteria">${mensajeTexto}</div>
    <button class="copy-btn" onclick="copiarMensajeCafeteria()">📋 Copiar mensaje</button>
  `;
  document.getElementById('cafeteriaOverlay').classList.add('open');
}

function copiarMensajeCafeteria() {
  const texto = document.getElementById('mensajeCafeteria').innerText;
  navigator.clipboard.writeText(texto).catch(() => {
    const el = document.getElementById('mensajeCafeteria');
    const r = document.createRange();
    r.selectNodeContents(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(r);
    document.execCommand('copy');
  });
  const btn = document.querySelector('#cafeteriaContenido .copy-btn');
  btn.textContent = '✓ ¡Copiado!';
  setTimeout(() => btn.textContent = '📋 Copiar mensaje', 2000);
}

// ── COCINA ───────────────────────────────────────────────────────────
function abrirCocina() {
  const ventasCocina = DATA.filter(d => d.Categoria === 'COCINA');
  const totalVentas = ventasCocina.reduce((s, d) => s + (d.Total || 0), 0);

  const pagosCocina = GASTOS.filter(g => g['Categoría'] === 'Cocina');
  const totalPagos = pagosCocina.reduce((s, g) => s + (g.Importe || 0), 0);
  const cantPagos = pagosCocina.length;

  const diff = Math.abs(totalVentas - totalPagos);
  const iguales = diff < 1;
  const base = totalVentas > totalPagos ? totalVentas : totalPagos;
  const comision = base * 0.10;

  // Mes del período
  const mes = periodoActivo.label;

  const listaPagos = pagosCocina.map(p =>
    `<div class="pagos-list-row"><span>${p.Fecha} — ${p.Comentario || 'Cocina del día'}</span><span>${fmt(p.Importe)}</span></div>`
  ).join('');

  const alertaLinea = iguales
    ? '✅ Ventas y pagos coinciden.'
    : `⚠️ Las ventas (${fmt(totalVentas)}) superan los pagos (${fmt(totalPagos)}) por ${fmt(diff)}. Se calculó la comisión sobre las ventas.`;

  const mensajeTexto =
`Te paso el resumen de cocina de ${mes}:

🍳 Total de ventas del mes: ${fmt(totalVentas)}
💸 Total de pagos registrados: ${fmt(totalPagos)} (${cantPagos} pagos)

💰 Comisión a cobrar (10%): ${fmt(comision)}`;

  document.getElementById('cocinaContenido').innerHTML = `
    <div class="cocina-row">
      <span class="cocina-label">Ventas COCINA del mes</span>
      <span class="cocina-val green">${fmt(totalVentas)}</span>
    </div>
    <div class="cocina-row">
      <span class="cocina-label">Pagos registrados (${cantPagos} pagos)</span>
      <span class="cocina-val orange">${fmt(totalPagos)}</span>
    </div>
    <div class="pagos-list">${listaPagos}</div>
    <div class="alerta-box ${iguales ? 'alerta-ok' : 'alerta-warn'}">
      ${iguales
        ? '✅ Los montos <strong>coinciden</strong>. Comisión sobre ese valor.'
        : `⚠️ Los montos <strong>no coinciden</strong>. Diferencia: <strong>${fmt(diff)}</strong>. Se usa el mayor (ventas) como base.`}
    </div>
    <div class="cocina-row" style="margin-top:4px">
      <span class="cocina-label" style="font-weight:700;color:var(--text)">💰 Comisión a cobrar (10%)</span>
      <span class="cocina-val green" style="font-size:1rem;font-weight:700">${fmt(comision)}</span>
    </div>
    <div style="font-size:0.71rem;color:var(--muted);padding:4px 0 12px">
      Base: ${fmt(base)} ${totalVentas > totalPagos ? '— ventas (mayor valor)' : '— pagos abonados'}
    </div>
    <div style="font-size:0.72rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--border);padding-top:12px;margin-bottom:6px">Mensaje para enviar</div>
    <div class="mensaje-box" id="mensajeCocina">${mensajeTexto}</div>
    <button class="copy-btn" onclick="copiarMensaje()">📋 Copiar mensaje</button>
  `;
  document.getElementById('cocinaOverlay').classList.add('open');
}

function cerrarCocina() {
  document.getElementById('cocinaOverlay').classList.remove('open');
}

function copiarMensaje() {
  const texto = document.getElementById('mensajeCocina').innerText;
  navigator.clipboard.writeText(texto).catch(() => {
    const el = document.getElementById('mensajeCocina');
    const r = document.createRange();
    r.selectNodeContents(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(r);
    document.execCommand('copy');
  });
  const btn = document.querySelector('.copy-btn');
  btn.textContent = '✓ ¡Copiado!';
  setTimeout(() => btn.textContent = '📋 Copiar mensaje', 2000);
}

// ── INIT ──────────────────────────────────────────────────────────────
function mostrarBienvenida() {
  addMessage('ai', `¡Hola! Soy tu agente financiero 🏟️<br><br>
Datos cargados: <span class="highlight">${periodoActivo.label}</span><br><br>
💰 <b>Ventas:</b> <span class="highlight">${fmt(totalGeneral)}</span> — ${catSorted.length} rubros, ${DATA.length} productos<br>
💸 <b>Gastos:</b> <span class="highlight">${fmt(totalGastos)}</span> — ${Object.keys(gastosPorCat).length} categorías, ${GASTOS.length} registros<br>
📊 <b>Resultado neto:</b> <span class="highlight" style="color:${totalGeneral > totalGastos ? 'var(--green)' : '#ff6b35'}">${fmt(totalGeneral - totalGastos)}</span><br><br>
Podés preguntarme sobre ventas, gastos, sueldos, compras o cualquier análisis. ¿Por dónde arrancamos?`);
}

function initPeriodoNav() {
  const nav = document.getElementById('periodoNav');
  // Mantener el label
  PERIODOS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'periodo-btn' + (p.id === periodoActivo.id ? ' active' : '');
    btn.dataset.id = p.id;
    btn.textContent = p.label;
    btn.onclick = () => setPeriodo(p.id);
    nav.appendChild(btn);
  });
}

// Arrancar
recalcular();
initPeriodoNav();
buildSidebar();
mostrarBienvenida();
</script>
</body>
</html>
